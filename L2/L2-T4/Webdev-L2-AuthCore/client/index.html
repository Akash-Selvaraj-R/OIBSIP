<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AUTHCORE — Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-split">
    <div class="auth-brand">
      <div class="brand-top">
        <div class="brand-logo">AUTHCORE</div>
      </div>
      <div class="brand-block">
        <div class="brand-label">IDENTITY INFRASTRUCTURE</div>
        <div class="brand-title">SECURE<br>ACCESS.</div>
        <div class="brand-number">01</div>
        <div class="brand-statement">SECURE ACCESS.<br>NOT DECORATION.</div>
      </div>
      <div class="brand-bottom">&copy; 2026 AUTHCORE</div>
    </div>

    <div class="auth-form-panel">
      <div class="form-header">
        <div class="form-header-label">ENTER CREDENTIALS</div>
        <div class="form-header-title">LOGIN</div>
      </div>

      <form id="loginForm" class="auth-form" novalidate>
        <div class="form-group">
          <label for="email">EMAIL</label>
          <input type="email" id="email" name="email" placeholder="user@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password">PASSWORD</label>
          <input type="password" id="password" name="password" placeholder="Enter password" required autocomplete="current-password">
        </div>
        <div id="errorMessage" class="error-message" aria-live="polite"></div>
        <button type="submit" class="btn-primary" id="loginBtn">
          <span class="btn-text">AUTHENTICATE</span>
          <span class="btn-loader hidden"></span>
        </button>
      </form>

      <div class="auth-footer">
        <p>NO IDENTITY? <a href="/register">CREATE ONE</a></p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errorEl = document.getElementById('errorMessage');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      errorEl.textContent = '';
      setLoading(btn, true);

      if (!email || !password) {
        errorEl.textContent = 'All fields are required.';
        setLoading(btn, false);
        return;
      }

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) {
          errorEl.textContent = data.error || 'Login failed.';
          setLoading(btn, false);
          return;
        }
        window.location.href = '/dashboard';
      } catch (err) {
        errorEl.textContent = 'Connection error.';
        setLoading(btn, false);
      }
    });
  </script>
</body>
</html>
